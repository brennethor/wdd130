<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        body {
            background: #e8eced;
        }
        #wrapper {
            background: url("images/christus.webp");
            border: 7px solid black;
            width: 777px;
            height: 600px;
            margin: 0 auto;
            border-radius: 20px;
            background-size: cover;
            background-position-x: -178px;
            text-align: center;

        }
    .pres {
        width: 110px;
        height: 110px;
        border-radius: 50px;
        border: 5px solid white;
    }
    .firstp {
        width:100px;
        height:100px;
        border-radius: 50px;
        border: 5px solid white;
    }
    .twelve {
       
        
        width: 90px;
        height: 90px;
        border-radius: 50px;
        border: 5px solid white;

    }

    #twelve_grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        justify-items: center;
        align-items: center;
    }

 




       
        /* Insert styles here */
    </style>
</head>
<body>
    <div id="wrapper">
        <h1>First presidency</h1>
        <img class="firstp" src="images/eyring.webp" alt="Eyering">
        <img class="pres" src="images/oaks.webp" alt="Oaks">
        <img class="firstp" src="images/christofferson.webp" alt="christofferson">
        <H2>Quorum of the twelve</H2>
        <div id="twelve_grid">

        <img class="twelve" src="images/bednar.webp" alt="Bednar">
        <img class="twelve" src="images/cook.webp" alt="Cook">

        <img class="twelve" src="images/gong.webp" alt="Gong">
        <img class="twelve" src="images/soares.webp" alt="Soares">
        <img class="twelve" src="images/kearon.webp" alt="Kearon">
        <img class="twelve" src="images/causse.webp" alt="Causse">
        <img class="twelve" src="images/gilbert.webp" alt="Gilbert">
        </div>
